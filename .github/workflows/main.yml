name: Actualizar Tasas Vivienda

on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'

      # AQUÍ ESTÁ EL CAMBIO: Le damos la ruta exacta dentro de la carpeta .github/workflows/
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar proceso
        env:
                # 1. Mapeamos tu SECRETO de GitHub a la variable que leerá Python
                GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
                
                # 2. Mapeamos tus VARIABLES de GitHub al entorno del script
                SOCRATA_TOKEN: ${{ vars.SOCRATA_TOKEN }}
                SOCRATA_USER: ${{ vars.SOCRATA_USER }}
                SOCRATA_PASSWORD: ${{ vars.SOCRATA_PASSWORD }}
              run: python tasas.py
