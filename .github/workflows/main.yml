name: Actualizar Tasas Vivienda

on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'

      # AQUÍ ESTÁ EL CAMBIO: Le damos la ruta exacta dentro de la carpeta .github/workflows/
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear credenciales GCP
        run: echo '${{ secrets.GCP_SA_KEY }}' > service_account.json

      - name: Variables Socrata
        run: |
          echo "SOCRATA_TOKEN=${{ vars.SOCRATA_TOKEN }}" >> $GITHUB_ENV
          echo "SOCRATA_USER=${{ vars.SOCRATA_USER }}" >> $GITHUB_ENV
          echo "SOCRATA_PASSWORD=${{ vars.SOCRATA_PASSWORD }}" >> $GITHUB_ENV
      - name: Ejecutar proceso
        run: python tasas.py
